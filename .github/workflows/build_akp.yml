name: Build and Release Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'
          channel: 'stable'
          cache: true

      - name: Generate Android project structure
        run: |
          flutter create . --platforms=android --org com.hotelpos
          
          # Kotlin Version
          echo 'buildscript { ext.kotlin_version = "1.9.20" }' | cat - android/build.gradle > /tmp/bg && mv /tmp/bg android/build.gradle
          if [ -f "android/settings.gradle" ]; then
            sed -i -E "s/(org\.jetbrains\.kotlin\.android.*version )['\"][^'\"]+['\"]/\1\"1.9.20\"/g" android/settings.gradle
          fi

          # minSdkVersion 21
          sed -i -E "s/minSdkVersion [^0-9]*/minSdkVersion 21/g" android/app/build.gradle
          sed -i -E "s/minSdkVersion = .*/minSdkVersion = 21/g" android/app/build.gradle

          # App Name 'AALA'
          sed -i 's/android:label="[^"]*"/android:label="AALA"/g' android/app/src/main/AndroidManifest.xml

          # ऐप के अंदर ऑटो-अपडेट इंस्टॉल की अनुमति
          sed -i '/<manifest/a \    <uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES" />' android/app/src/main/AndroidManifest.xml

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Publish Direct APK Release (No Zip)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "AALA POS Latest Version"
          files: build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
