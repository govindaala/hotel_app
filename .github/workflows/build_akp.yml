name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'
          channel: 'stable'
          cache: true

      - name: Generate Android project structure
        run: |
          flutter create . --platforms=android --org com.hotelpos
          
          # 1. Kotlin वर्शन 1.9.20 सेट करना (TTS एरर समाधान)
          sed -i "s/ext.kotlin_version = .*/ext.kotlin_version = '1.9.20'/g" android/build.gradle
          
          # 2. ऐप का नाम बदलकर 'AALA' करना
          sed -i 's/android:label="[^"]*"/android:label="AALA"/g' android/app/src/main/AndroidManifest.xml

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AALA-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk
