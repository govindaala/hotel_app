name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.6'
          channel: 'stable'
          cache: true

      - name: Generate Android project structure
        run: |
          flutter create . --platforms=android --org com.hotelpos
          
          # 1. Kotlin 1.9.20 इंजेक्ट करना
          echo 'buildscript { ext.kotlin_version = "1.9.20" }' | cat - android/build.gradle > /tmp/bg && mv /tmp/bg android/build.gradle
          if [ -f "android/settings.gradle" ]; then
            sed -i -E "s/(org\.jetbrains\.kotlin\.android.*version )['\"][^'\"]+['\"]/\1\"1.9.20\"/g" android/settings.gradle
          fi

          # 2. minSdkVersion को 21 पर सेट करना (flutter_tts एरर समाधान)
          sed -i -E "s/minSdkVersion [^0-9]*/minSdkVersion 21/g" android/app/build.gradle
          sed -i -E "s/minSdkVersion = .*/minSdkVersion = 21/g" android/app/build.gradle

          # 3. ऐप का नाम 'AALA' करना
          sed -i 's/android:label="[^"]*"/android:label="AALA"/g' android/app/src/main/AndroidManifest.xml

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AALA-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk
