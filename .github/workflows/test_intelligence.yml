name: Test Python Hotel Intelligence
on:
  push:
    branches:
      - main
      - feature/python-waste-intelligence-report
    paths:
      - "python_intelligence/**"
      - ".github/workflows/test_intelligence.yml"
  pull_request:
    paths:
      - "python_intelligence/**"
      - ".github/workflows/test_intelligence.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python_intelligence
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      - name: Run intelligence engine tests
        run: pytest -q
