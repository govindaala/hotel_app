name: QR Tracking Flutter Validation

on:
  pull_request:
    branches:
      - "feature/pos-complete-customer-crm"
    paths:
      - "lib/main.dart"
      - "lib/screens/admin/restaurant_settings_screen.dart"
      - "lib/services/**"
      - "pubspec.yaml"
      - ".github/workflows/qr_tracking_flutter_validation.yml"

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.19.6"
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze Flutter application
        run: flutter analyze --no-pub
