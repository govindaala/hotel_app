name: hotel_pos
description: "AALA POS - Modern Multi-Tenant Hotel ERP & Supply System"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # QR जनरेशन व एक्सटर्नल लिंकिंग
  qr_flutter: ^4.1.0
  url_launcher: ^6.2.5

  # डेटाबेस व क्लाउड सिंक
  supabase_flutter: ^2.6.0
  shared_preferences: ^2.2.3
  http: ^1.2.0

  # ब्लूटूथ थर्मल प्रिंटर
  print_bluetooth_thermal: ^1.1.2
  esc_pos_utils_plus: ^2.0.4

  # PDF जनरेशन, स्क्रीनशॉट व शेयरिंग
  pdf: ^3.10.8
  screenshot: ^3.1.0
  path_provider: ^2.1.2
  share_plus: ^9.0.0

  # ऑटो-अपडेट व वॉयस
  ota_update: ^5.0.0
  flutter_tts: ^4.0.2
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/templates/app_icon.png
