name: hotel_pos
description: "Zero Cost Offline First Hotel POS and Supply System"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
    
  # ऑटो-अपडेट के लिए ये 2 लाइनें:
  ota_update: ^6.0.0
  

  # Backend & Storage
  supabase_flutter: ^2.5.6
  shared_preferences: ^2.2.3
  http: ^1.2.0

  # Bluetooth Printer
  print_bluetooth_thermal: ^1.1.2
  esc_pos_utils_plus: ^2.0.3

  # Hindi Receipt & Screenshot
  screenshot: ^2.1.1
  path_provider: ^2.1.1
  image: ^4.1.3

  # Voice Alert, PDF & Sharing
  flutter_tts: 4.0.2
  pdf: ^3.10.8
  share_plus: ^8.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
